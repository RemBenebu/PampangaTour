<!DOCTYPE html>
<html>
<head>
    <title>Booking - Pampanga</title>
<style>

body {
  margin: 0;
  min-height: 100vh;
  background: url('Images/BookingPage/Aqua-Planet.jpg') center/cover no-repeat;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.overlay {
  width: 95%;
  max-width: 1200px;
  background: rgba(255,255,255,0.75);
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0px 0px 30px rgba(0,0,0,0.3);
}

.title {
  text-align: center;
  font-size: 25px;
  margin-bottom: 20px;
}

.nav {
  text-align: center;
  margin-bottom: 25px;
}

.nav a {
  margin: 5px;
  text-decoration: none;
  background: white;
  padding: 8px 18px;
  border-radius: 20px;
  color: #1e40af;
}

.nav a:hover {
  background: #1e40af;
  color: white;
}

.form-container {
  display: flex;
  justify-content: center;
}

form {
  width: 100%;
  max-width: 500px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

input, select, textarea {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

textarea {
  resize: none;
  height: 100px;
}

button {
  padding: 12px;
  border: none;
  border-radius: 20px;
  background: #1e40af;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #f59e0b;
}

</style>
</head>
<body>

<section class="hero">
  <div class="overlay">

    <div class="title"><h1>Book Your Tour</h1></div>

    <div class="nav">
      <a href="home.html">HOME</a>
      <a href="destinations.html">DESTINATIONS</a>
      <a href="tours.html">TOURS</a>
      <a href="about.html">ABOUT</a>
    </div>

    <div class="form-container">
      <form>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email Address" required>

        <select required>
          <option value="">Select Destination</option>
          <option>Angeles City</option>
          <option>Apalit</option>
          <option>Arayat</option>
          <option>Bacolor</option>
          <option>Candaba</option>
          <option>Floridablanca</option>
          <option>Guagua</option>
          <option>Lubao</option>
          <option>Mabalacat City</option>
          <option>Macabebe</option>
          <option>Magalang</option>
          <option>Masantol</option>
          <option>Mexico</option>
          <option>Minalin</option>
          <option>Porac</option>
          <option>City of San Fernando</option>
          <option>San Luis</option>
          <option>San Simon</option>
          <option>Santa Ana</option>
          <option>Santa Rita</option>
          <option>Santo Tomas</option>
          <option>Sasmuan</option>
        </select>

        <input type="date" required>

        <button type="submit">Submit Booking</button>
      </form>
    </div>

  </div>
</section>

</body>
</html>
